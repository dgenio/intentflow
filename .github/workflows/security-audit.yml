name: security-audit

# Standalone supply-chain scan (#79). Deliberately scoped to vulnerability
# auditing only — the test matrix / lint / format / type checks are owned by a
# separate CI workflow (#22). This runs pip-audit over the installed extras so a
# known-vulnerable dependency in an optional SDK is surfaced early.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package with all extras and the audit tool
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,llm,openai,sign,audit]"
      - name: Run pip-audit
        # Advisory mode first (does not fail the build) so we establish a clean
        # baseline before making it blocking. Flip to remove `|| true` once green.
        run: pip-audit || true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate a CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          pip install ".[audit]"
          cyclonedx-py environment --output-format json --outfile sbom.json || \
            cyclonedx-py --help
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore
