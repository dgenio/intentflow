name: security-audit

# Standalone supply-chain scan (#79). Deliberately scoped to vulnerability
# auditing only — the test matrix / lint / format / type checks are owned by a
# separate CI workflow (#22). This runs pip-audit over the installed functional
# extras so a known-vulnerable optional provider/signing dependency is surfaced.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package with user extras and audit toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[llm,openai,sign]" --group audit
      - name: Run pip-audit
        # Advisory mode first (does not fail the build) so we establish a clean
        # baseline before making it blocking. Flip to remove `|| true` once green.
        run: pip-audit || true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate a CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[llm,openai,sign]" --group audit
          cyclonedx-py environment --output-format json --outfile sbom.json || \
            cyclonedx-py --help
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore
