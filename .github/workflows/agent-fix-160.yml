name: Temporary agent patch for #160

on:
  push:
    branches:
      - agent/fail-closed-verification-160

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-160]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fail-closed-verification-160
      - name: Apply focused compatibility patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "intentflow/cli.py",
              '''        judge_cassette = args.cassette if args.judge == "replay" else args.record_cassette\n        judge = make_judge(args.judge, judge_cassette) if args.judge else None\n''',
              '''        judge_name = args.judge or ("simulate" if backend_name == "simulate" else None)\n        judge_cassette = args.cassette if judge_name == "replay" else args.record_cassette\n        judge = make_judge(judge_name, judge_cassette) if judge_name else None\n''',
          )

          replace_once(
              "intentflow/api.py",
              '''        registry = self._registry(workspace)\n        return execute_program(\n            self._program,\n            goal,\n            backend=self._backend(backend, cassette),\n''',
              '''        registry = self._registry(workspace)\n        resolved_judge: str | Judge | None = judge\n        if resolved_judge is None and backend == "simulate":\n            resolved_judge = "simulate"\n        return execute_program(\n            self._program,\n            goal,\n            backend=self._backend(backend, cassette),\n''',
          )
          replace_once(
              "intentflow/api.py",
              '''            judge=self._judge(judge, cassette),\n            registry=registry,\n''',
              '''            judge=self._judge(resolved_judge, cassette),\n            registry=registry,\n''',
          )
          replace_once(
              "intentflow/api.py",
              '''        document = self.compile()\n        registry = self._registry(workspace)\n        return run_pipeline(\n''',
              '''        document = self.compile()\n        registry = self._registry(workspace)\n        resolved_judge: str | Judge | None = judge\n        if resolved_judge is None and backend == "simulate":\n            resolved_judge = "simulate"\n        return run_pipeline(\n''',
          )
          replace_once(
              "intentflow/api.py",
              '''            judge=self._judge(judge, cassette),\n            approver=self._approver(approve, approver),\n''',
              '''            judge=self._judge(resolved_judge, cassette),\n            approver=self._approver(approve, approver),\n''',
          )

          replace_once(
              "tests/test_cassette.py",
              '''    # supplied. Now the cassette reaches the replay judge: with no recorded\n    # verdict it misses on the rule (fail-closed BackendError) instead.\n    from intentflow.api import IntentFlowProgram\n    from intentflow.backends import BackendError\n\n    cpath = tmp_path / "empty-judge.cassette.json"\n    Cassette(cpath).save()  # a real cassette, but without this run's verdict\n    program = IntentFlowProgram(parse_source(_JUDGED_SRC))\n\n    with pytest.raises(BackendError, match="no recorded judge reply"):\n        program.run(backend="simulate", judge="replay", cassette=cpath)\n''',
              '''    # supplied. Now the cassette reaches the replay judge: with no recorded\n    # verdict the judge error is captured as an incomplete mandatory check, so\n    # the run fails closed while preserving an auditable result.\n    from intentflow.api import IntentFlowProgram\n\n    cpath = tmp_path / "empty-judge.cassette.json"\n    Cassette(cpath).save()  # a real cassette, but without this run's verdict\n    program = IntentFlowProgram(parse_source(_JUDGED_SRC))\n\n    result = program.run(backend="simulate", judge="replay", cassette=cpath)\n    assert result["status"] == "failed_verification"\n    assert result["verification"]["status"] == "incomplete"\n    judged = [c for c in result["verification"]["checks"] if c["mode"] == "judged"]\n    assert judged and judged[0]["status"] == "skipped"\n    assert "no recorded judge reply" in judged[0]["note"]\n''',
          )
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intentflow/cli.py intentflow/api.py tests/test_cassette.py
          if ! git diff --cached --quiet; then
            git commit -m "[agent-patch-160] Make simulated execution fully judged"
            git push origin HEAD:agent/fail-closed-verification-160
          fi
