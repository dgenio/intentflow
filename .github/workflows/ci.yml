name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        # Existing tests intentionally import examples.* from the repository
        # checkout. `python -m pytest` puts the checkout root on sys.path;
        # invoking the installed pytest console script does not guarantee that.
        run: python -m pytest -q

  bare-install:
    name: Dependency-free core install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package only
        run: pip install .
      - name: Import and CLI smoke
        run: |
          python -c "import intentflow; print(intentflow.__name__)"
          intentflow --help >/dev/null

  extras:
    name: Extra ${{ matrix.extra }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: llm
            import_name: anthropic
          - extra: openai
            import_name: openai
          - extra: sign
            import_name: cryptography
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install extra
        run: |
          python -m pip install --upgrade pip
          pip install ".[${{ matrix.extra }}]"
      - name: Smoke import
        run: python -c "import intentflow, ${{ matrix.import_name }}; print('extra ${{ matrix.extra }} ok')"
