<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <rect width="760" height="420" rx="10" fill="#0d1117"/>
  <rect width="760" height="30" rx="10" fill="#161b22"/>
  <rect y="20" width="760" height="10" fill="#161b22"/>
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="15" r="5" fill="#27c93f"/>
  <text x="380" y="19" fill="#8b949e" text-anchor="middle" font-size="12">intentflow — run · tamper · audit</text>
  <g fill="#c9d1d9">
    <text x="16" y="58"><tspan fill="#7ee787">$</tspan> intentflow run triage.iflow --simulate --trace-out result.json</text>
    <text x="16" y="80" fill="#8b949e">status: needs_human · trace written to result.json</text>

    <text x="16" y="112"><tspan fill="#7ee787">$</tspan> intentflow audit triage.iflow result.json</text>
    <text x="16" y="134"><tspan fill="#3fb950">CONFORMANT</tspan> — the run stayed inside its contract</text>

    <text x="16" y="166" fill="#8b949e"># now hand-edit one field of the saved trace...</text>
    <text x="16" y="188"><tspan fill="#7ee787">$</tspan> python -c "…; d['result']['citations']=['E99']; …"</text>

    <text x="16" y="220"><tspan fill="#7ee787">$</tspan> intentflow audit triage.iflow result.json</text>
    <text x="16" y="242"><tspan fill="#f85149">NONCONFORMANT</tspan> — 1 violation</text>
    <text x="16" y="264" fill="#ff7b72">  E1 — result cites evidence that was never collected: E99</text>
    <text x="16" y="286" fill="#8b949e">     (the forged citation points at nothing the run gathered)</text>

    <text x="16" y="330" fill="#c9d1d9">Programs are contracts. Traces are witnesses.</text>
    <text x="16" y="352" fill="#8b949e">You did not have to trust the runtime — the witness proves it.</text>
  </g>
  <text x="744" y="404" fill="#30363d" text-anchor="end" font-size="11">offline · deterministic · no API key</text>
</svg>
