[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intentflow"
version = "0.6.0"
description = "An experimental language for governed cognitive processes: goals, evidence, uncertainty, verification, and auditable agent execution."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "IntentFlow contributors" }]
keywords = ["llm", "agents", "language", "compiler", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dgenio/intentflow"
Repository = "https://github.com/dgenio/intentflow"
Issues = "https://github.com/dgenio/intentflow/issues"
Changelog = "https://github.com/dgenio/intentflow/blob/main/CHANGELOG.md"

[project.scripts]
intentflow = "intentflow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.18", "cryptography>=42"]
llm = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
sign = ["cryptography>=42"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
audit = ["pip-audit>=2.7", "cyclonedx-bom>=4.0"]

[tool.setuptools.packages.find]
include = ["intentflow*"]

[tool.setuptools.package-data]
intentflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
